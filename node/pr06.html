Pozdrav iz spletne strani html - uporaba knjižnice express!
<br>
Uporaba webSocket-a
<br>
<button id="pošljiSporočilo" onClick="pošljiSporočilo()">Pošlji sporočilo</button>
<br>
Sporočilo: <input id="sporočilo" size="50" value="Testno sporočilo!">

<script>
"use strict"; // omogočimo strogi način

let ws = new WebSocket("ws://192.168.1.198:8888"); // ustvarimo povezavo prek spletnega vtičnika - povežemo se z node.js preko vrat oz. porta 8888

function pošljiSporočilo(){
    let sporočilo = document.getElementById("sporočilo").value; // string iz tekstnega input polja html vmesnika
    ws.send(sporočilo); // naše sporočilo "Testno sporočilo!" pošljemo preko spletnega vtičnika ws port 8888
}

</script>
