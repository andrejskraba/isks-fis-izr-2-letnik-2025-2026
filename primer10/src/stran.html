<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Primer s spletnim vtičnikom WebSocket.</h2>
    <button onclick='prižgi()'>Prižgi LED</button>
    <button onclick='ugasni()'>Ugasni LED</button>

<script>
    
    let povezava = new WebSocket('ws://192.168.1.185:81/'); // vzpostavitev povezave preko spletnega vtičnika WebSocket

    function prižgi() {
        povezava.send("1"); // na strežik pošljem sporočilo z enko
    }

    function ugasni() {
        povezava.send("0"); // na strežik pošljem sporočilo 
    }

</script>

</body>
</html>
